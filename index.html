<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 Планер дел с тайм-трекингом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .controls label {
            font-weight: bold;
            color: #555;
        }

        .controls input[type="date"] {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #5a67d8;
        }

        .clear-all {
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-all:hover {
            background: #c82333;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .day-card:hover {
            transform: translateY(-4px);
        }

        .day-card.today {
            border: 3px solid #ff6b6b;
            background: linear-gradient(to bottom, white, #fff5f5);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
            gap: 5px;
        }

        .day-name {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #4a4a4a;
        }

        .day-date {
            font-size: 0.9rem;
            color: #888;
        }

        .time-bar {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .time-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .time-bar-header strong {
            color: #333;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #28a745, #20c997);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: white;
            font-weight: bold;
            min-width: 20px;
        }

        .time-calc {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .time-calc input {
            flex: 1;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 80px;
            text-align: center;
        }

        .time-calc input:focus {
            border-color: #667eea;
        }

        .time-calc button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .time-calc button:hover {
            background: #5a67d8;
        }

        .task-list {
            list-style: none;
            min-height: 60px;
            margin-bottom: 12px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            margin-bottom: 6px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: background 0.2s;
            flex-wrap: wrap;
        }

        .task.done span {
            text-decoration: line-through;
            color: #999;
        }

        .task.done {
            background: #e8f5e9;
        }

        .task input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #28a745;
        }

        .task span {
            font-size: 0.95rem;
            flex: 1;
            min-width: 100px;
        }

        .task .task-time {
            font-size: 0.85rem;
            color: #666;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .task .delete-btn {
            color: #dc3545;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            padding: 0 4px;
        }

        .task .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .add-form input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .add-form input[type="text"]:focus {
            border-color: #667eea;
        }

        .add-form input[type="number"] {
            width: 60px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
        }

        .add-form button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-form button:hover {
            background: #5a67d8;
        }

        .empty-message {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
        }

        .stats {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-top: 20px;
            font-size: 1rem;
        }

        .filtered-message {
            text-align: center;
            color: white;
            font-size: 1.1rem;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Планер охуенной Ви</h1>

        <!-- Панель управления -->
        <div class="controls">
            <label>С:</label>
            <input type="date" id="startDate">
            <label>по:</label>
            <input type="date" id="endDate">
            <button onclick="showSelectedDates()">📅 Показать даты</button>
            <button onclick="showWeek()">📆 Показать неделю</button>
            <button class="clear-all" onclick="clearAllTasks()">🗑 Очистить все</button>
        </div>

        <!-- Контейнер для дат/недели -->
        <div id="viewContainer"></div>

        <div class="stats" id="stats"></div>
    </div>

    <script>
        // Задачи
        let tasks = {};
        let currentView = 'week'; // 'week' или 'custom'

        // Загрузка из localStorage
        function loadTasks() {
            const saved = localStorage.getItem('plannerTasksV2');
            if (saved) tasks = JSON.parse(saved);
        }

        // Сохранение
        function saveTasks() {
            localStorage.setItem('plannerTasksV2', JSON.stringify(tasks));
        }

        // Дата в строку YYYY-MM-DD
        function formatDate(date) {
            return date.getFullYear() + '-' +
                   String(date.getMonth() + 1).padStart(2, '0') + '-' +
                   String(date.getDate()).padStart(2, '0');
        }

        // Строка в Date
        function parseDate(str) {
            const parts = str.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        // Даты недели
        function getWeekDates() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        // Дни недели
        const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

        // Рендер одного дня
        function renderDay(date, isToday) {
            const dateStr = formatDate(date);
            const dayTasks = tasks[dateStr] || [];
            const totalTime = dayTasks.reduce((sum, t) => sum + (t.time || 0), 0);
            const doneTime = dayTasks.filter(t => t.done).reduce((sum, t) => sum + (t.time || 0), 0);

            const card = document.createElement('div');
            card.className = 'day-card' + (isToday ? ' today' : '');
            card.innerHTML = `
                <div class="day-header">
                    <span class="day-name">${dayNames[date.getDay() === 0 ? 6 : date.getDay() - 1]}</span>
                    <span class="day-date">${date.getDate()}.${date.getMonth() + 1}.${date.getFullYear()}${isToday ? ' 📌' : ''}</span>
                </div>

                <div class="time-bar">
                    <div class="time-bar-header">
                        <strong>⏱ Время: ${totalTime}ч</strong>
                        <span>Выполнено: ${doneTime}ч</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${totalTime > 0 ? (doneTime / totalTime * 100) : 0}%;">
                            ${totalTime > 0 ? Math.round(doneTime / totalTime * 100) + '%' : ''}
                        </div>
                    </div>
                </div>

                <div class="time-calc">
                    <input type="number" id="addTime-${dateStr}" placeholder="Часы" min="0" max="24" step="0.5">
                    <button onclick="addTimeToDay('${dateStr}')">⏱ + Часы</button>
                </div>

                <ul class="task-list" id="taskList-${dateStr}">
                    ${dayTasks.length === 0 ? '<li class="empty-message">Нет задач</li>' : ''}
                    ${dayTasks.map((task, idx) => `
                        <li class="task ${task.done ? 'done' : ''}">
                            <input type="checkbox" ${task.done ? 'checked' : ''} 
                                   onchange="toggleTask('${dateStr}', ${idx})">
                            <span>${task.title}</span>
                            <span class="task-time">${task.time || 0}ч</span>
                            <button class="delete-btn" onclick="deleteTask('${dateStr}', ${idx})">✖</button>
                        </li>
                    `).join('')}
                </ul>

                <form class="add-form" onsubmit="addTask(event, '${dateStr}')">
                    <input type="text" placeholder="Задача..." required>
                    <input type="number" placeholder="Часы" min="0" max="24" step="0.5">
                    <button type="submit">+</button>
                </form>
            `;
            return card;
        }

        // Рендер недели
        function renderWeek() {
            const container = document.getElementById('viewContainer');
            const dates = getWeekDates();
            const todayStr = formatDate(new Date());

            container.innerHTML = '<div class="week-grid"></div>';
            const grid = container.querySelector('.week-grid');

            dates.forEach(date => {
                const dateStr = formatDate(date);
                grid.appendChild(renderDay(date, dateStr === todayStr));
            });

            currentView = 'week';
        }

        // Добавление времени к дню (общая задача)
        function addTimeToDay(dateStr) {
            const input = document.getElementById('addTime-' + dateStr);
            const hours = parseFloat(input.value);
            
            if (hours && hours > 0) {
                if (!tasks[dateStr]) tasks[dateStr] = [];
                tasks[dateStr].push({
                    title: '💪 Работа',
                    done: false,
                    time: hours
                });
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
        }

        // Добавление задачи
        function addTask(event, dateStr) {
            event.preventDefault();
            const form = event.target;
            const title = form.querySelector('input[type="text"]').value.trim();
            const hours = parseFloat(form.querySelector('input[type="number"]').value) || 0;

            if (title) {
                if (!tasks[dateStr]) tasks[dateStr] = [];
                tasks[dateStr].push({ title: title, done: false, time: hours });
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
        }

        // Переключение задачи
        function toggleTask(dateStr, idx) {
            if (tasks[dateStr] && tasks[dateStr][idx]) {
                tasks[dateStr][idx].done = !tasks[dateStr][idx].done;
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
        }

        // Удаление задачи
        function deleteTask(dateStr, idx) {
            if (tasks[dateStr]) {
                tasks[dateStr].splice(idx, 1);
                if (tasks[dateStr].length === 0) delete tasks[dateStr];
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
        }

        // Очистка всего
        function clearAllTasks() {
            if (confirm('Точно удалить все задачи?')) {
                tasks = {};
                saveTasks();
                renderWeek();
            }
        }

        // Показать выбранные даты
        function showSelectedDates() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            if (!start || !end) {
                alert('Выбери начальную и конечную даты!');
                return;
            }

            if (start > end) {
                alert('Начальная дата не может быть позже конечной!');
                return;
            }

            const container = document.getElementById('viewContainer');
            container.innerHTML = '<div class="week-grid"></div>';
            const grid = container.querySelector('.week-grid');

            const current = parseDate(start);
            const endDate = parseDate(end);
            const todayStr = formatDate(new Date());

            while (current <= endDate) {
                const dateStr = formatDate(current);
                grid.appendChild(renderDay(new Date(current), dateStr === todayStr));
                current.setDate(current.getDate() + 1);
            }

            currentView = 'custom';
        }

        // Показать неделю
        function showWeek() {
            renderWeek();
        }

        // Статистика
        function updateStats() {
            let total = 0, done = 0, totalTime = 0, doneTime = 0;
            
            Object.keys(tasks).forEach(date => {
                tasks[date].forEach(task => {
                    total++;
                    if (task.done) done++;
                    totalTime += task.time || 0;
                    if (task.done) doneTime += task.time || 0;
                });
            });

            const percent = total > 0 ? Math.round((done / total) * 100) : 0;
            const timePercent = totalTime > 0 ? Math.round((doneTime / totalTime) * 100) : 0;

            document.getElementById('stats').innerHTML = 
                XXXINLINECODEXXX1XXXINLINECODEXXX;
        }

        // Установка текущих дат в фильтр
        function setDefaultDates() {
            const today = new Date();
            const weekAgo = new Date(today);
            weekAgo.setDate(today.getDate() - 7);
            
            document.getElementById('startDate').value = formatDate(weekAgo);
            document.getElementById('endDate').value = formatDate(today);
        }

        // Инициализация
        loadTasks();
        setDefaultDates();
        renderWeek();
        updateStats();
    </script>
</body>
</html>
