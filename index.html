<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 Планер дел с тайм-трекингом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .controls label {
            font-weight: bold;
            color: #555;
        }

        .controls input[type="date"] {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #5a67d8;
        }

        .clear-all {
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-all:hover {
            background: #c82333;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .day-card:hover {
            transform: translateY(-4px);
        }

        .day-card.today {
            border: 3px solid #ff6b6b;
            background: linear-gradient(to bottom, white, #fff5f5);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
            gap: 5px;
        }

        .day-name {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #4a4a4a;
        }

        .day-date {
            font-size: 0.9rem;
            color: #888;
        }

        .time-bar {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .time-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .time-bar-header strong {
            color: #333;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #28a745, #20c997);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: white;
            font-weight: bold;
            min-width: 20px;
        }

        /* ===== ЭЛЕКТРОННЫЕ ЧАСЫ ===== */
        .digital-clock {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .clock-display {
            background: #0f0f23;
            border-radius: 8px;
            padding: 8px 20px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
            letter-spacing: 3px;
            cursor: pointer;
            user-select: none;
            border: 2px solid #00ff88;
            text-align: center;
            width: 100%;
            transition: all 0.2s;
        }

        .clock-display:hover {
            background: #1a1a3e;
            transform: scale(1.02);
        }

        .clock-display small {
            font-size: 0.8rem;
            color: #00ccff;
            display: block;
            margin-top: 4px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* Ползунок */
        .time-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: 2px solid #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.5);
        }

        .time-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: 2px solid #00ff88;
        }

        .slider-label {
            color: #aaa;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        /* Кнопка добавления времени */
        .add-time-btn {
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .add-time-btn:hover {
            background: #00cc66;
            transform: scale(1.02);
        }

        /* Модальное окно для выбора времени */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .modal h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal .clock-preview {
            background: #1a1a2e;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 3rem;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 3px solid #00ff88;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
            text-align: center;
        }

        .modal input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #333;
            outline: none;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .modal input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: 2px solid #00ff88;
        }

        .modal .time-presets {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .modal .preset-btn {
            padding: 8px 12px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .modal .preset-btn:hover {
            background: #00ff88;
            border-color: #00ff88;
        }

        .modal .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal .modal-buttons button {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal .confirm-btn {
            background: #28a745;
            color: white;
        }

        .modal .confirm-btn:hover {
            background: #218838;
        }

        .modal .cancel-btn {
            background: #dc3545;
            color: white;
        }

        .modal .cancel-btn:hover {
            background: #c82333;
        }

        .task-list {
            list-style: none;
            min-height: 60px;
            margin-bottom: 12px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            margin-bottom: 6px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: background 0.2s;
            flex-wrap: wrap;
        }

        .task.done span {
            text-decoration: line-through;
            color: #999;
        }

        .task.done {
            background: #e8f5e9;
        }

        .task input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #28a745;
        }

        .task span {
            font-size: 0.95rem;
            flex: 1;
            min-width: 100px;
        }

        .task .task-time {
            font-size: 0.85rem;
            color: #ffffff;
            background: #1a1a2e;
            padding: 3px 10px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border: 1px solid #00ff88;
            box-shadow: 0 0 5px rgba(0,255,136,0.3);
        }

        .task .delete-btn {
            color: #dc3545;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            padding: 0 4px;
        }

        .task .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .add-form input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .add-form input[type="text"]:focus {
            border-color: #667eea;
        }

        .add-form button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-form button:hover {
            background: #5a67d8;
        }

        .empty-message {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
        }

        .stats {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-top: 20px;
            font-size: 1rem;
        }

        .filtered-message {
            text-align: center;
            color: white;
            font-size: 1.1rem;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Планер охуенной Ви</h1>

        <div class="controls">
            <label>С:</label>
            <input type="date" id="startDate">
            <label>по:</label>
            <input type="date" id="endDate">
            <button onclick="showSelectedDates()">📅 Показать даты</button>
            <button onclick="showWeek()">📆 Показать неделю</button>
            <button class="clear-all" onclick="clearAllTasks()">🗑 Очистить все</button>
        </div>

        <div id="viewContainer"></div>
        <div class="stats" id="stats"></div>
    </div>

    <!-- Модальное окно для выбора времени -->
    <div class="modal-overlay" id="timeModal">
        <div class="modal">
            <h3>⏱ Выбери время</h3>
            <div class="clock-preview" id="modalClockPreview">00:00</div>
            
            <label>Часы: <strong id="modalHoursLabel">0</strong></label>
            <input type="range" id="modalHoursSlider" min="0" max="24" value="0" step="1">
            
            <label>Минуты: <strong id="modalMinutesLabel">0</strong></label>
            <input type="range" id="modalMinutesSlider" min="0" max="55" value="0" step="5">
            
            <div class="time-presets">
                <button class="preset-btn" onclick="setPresetTime(0.5)">30м</button>
                <button class="preset-btn" onclick="setPresetTime(1)">1ч</button>
                <button class="preset-btn" onclick="setPresetTime(1.5)">1.5ч</button>
                <button class="preset-btn" onclick="setPresetTime(2)">2ч</button>
                <button class="preset-btn" onclick="setPresetTime(3)">3ч</button>
                <button class="preset-btn" onclick="setPresetTime(4)">4ч</button>
                <button class="preset-btn" onclick="setPresetTime(8)">8ч</button>
            </div>

            <div class="modal-buttons">
                <button class="confirm-btn" onclick="confirmTime()">✅ OK</button>
                <button class="cancel-btn" onclick="closeTimeModal()">❌ Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // Задачи
        let tasks = {};
        let currentView = 'week';
        let selectedDateStr = null;
        let selectedHours = 0;
        let selectedMinutes = 0;

        // Загрузка из localStorage
        function loadTasks() {
            const saved = localStorage.getItem('plannerTasksV3');
            if (saved) tasks = JSON.parse(saved);
        }

        function saveTasks() {
            localStorage.setItem('plannerTasksV3', JSON.stringify(tasks));
        }

        function formatDate(date) {
            return date.getFullYear() + '-' +
                   String(date.getMonth() + 1).padStart(2, '0') + '-' +
                   String(date.getDate()).padStart(2, '0');
        }

        function parseDate(str) {
            const parts = str.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function getWeekDates() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

        // ===== ЭЛЕКТРОННЫЕ ЧАСЫ =====
        function openTimeModal(dateStr) {
            selectedDateStr = dateStr;
            selectedHours = 0;
            selectedMinutes = 0;
            document.getElementById('modalHoursSlider').value = 0;
            document.getElementById('modalMinutesSlider').value = 0;
            updateModalClock();
            document.getElementById('timeModal').classList.add('active');
        }

        function closeTimeModal() {
            document.getElementById('timeModal').classList.remove('active');
        }

        function updateModalClock() {
            const hrs = document.getElementById('modalHoursSlider').value;
            const mins = document.getElementById('modalMinutesSlider').value;
            
            document.getElementById('modalHoursLabel').textContent = hrs;
            document.getElementById('modalMinutesLabel').textContent = mins;
            
            const timeStr = String(hrs).padStart(2, '0') + ':' + String(mins).padStart(2, '0');
            document.getElementById('modalClockPreview').textContent = timeStr;
        }

        function setPresetTime(hours) {
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            document.getElementById('modalHoursSlider').value = h;
            document.getElementById('modalMinutesSlider').value = m;
            updateModalClock();
        }

        function confirmTime() {
            const hrs = parseInt(document.getElementById('modalHoursSlider').value);
            const mins = parseInt(document.getElementById('modalMinutesSlider').value);
            const totalHours = hrs + (mins / 60);

            if (totalHours > 0) {
                if (!tasks[selectedDateStr]) tasks[selectedDateStr] = [];
                tasks[selectedDateStr].push({
                    title: '💪 Работа',
                    done: false,
                    time: totalHours
                });
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
            closeTimeModal();
        }

        // Рендер дня
        function renderDay(date, isToday) {
            const dateStr = formatDate(date);
            const dayTasks = tasks[dateStr] || [];
            const totalTime = dayTasks.reduce((sum, t) => sum + (t.time || 0), 0);
            const doneTime = dayTasks.filter(t => t.done).reduce((sum, t) => sum + (t.time || 0), 0);

            // Форматирование времени для электронных часов
            function formatHours(hours) {
                const h = Math.floor(hours);
                const m = Math.round((hours - h) * 60);
                return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            }

            const card = document.createElement('div');
            card.className = 'day-card' + (isToday ? ' today' : '');
            card.innerHTML = `
                <div class="day-header">
                    <span class="day-name">${dayNames[date.getDay() === 0 ? 6 : date.getDay() - 1]}</span>
                    <span class="day-date">${date.getDate()}.${date.getMonth() + 1}.${date.getFullYear()}${isToday ? ' 📌' : ''}</span>
                </div>

                <div class="time-bar">
                    <div class="time-bar-header">
                        <strong>⏱ Всего: ${formatHours(totalTime)}</strong>
                        <span>✅ Выполнено: ${formatHours(doneTime)}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${totalTime > 0 ? (doneTime / totalTime * 100) : 0}%;">
                            ${totalTime > 0 ? Math.round(doneTime / totalTime * 100) + '%' : ''}
                        </div>
                    </div>
                </div>

                <!-- Электронные часы с ползунком -->
                <div class="digital-clock">
                    <div class="clock-display" onclick="openTimeModal('${dateStr}')">
                        ${formatHours(totalTime)}
                        <small>👇 Тыкни, чтобы добавить время</small>
                    </div>
                    <div class="slider-label">
                        <span>0ч</span>
                        <span>Ползунок:</span>
                        <span>${Math.floor(totalTime)}ч</span>
                    </div>
                    <input type="range" class="time-slider" min="0" max="24" value="${Math.min(Math.floor(totalTime), 24)}" 
                           oninput="quickAddTime(this, '${dateStr}')">
                    <button class="add-time-btn" onclick="openTimeModal('${dateStr}')">⏱ + Добавить время</button>
                </div>

                <ul class="task-list" id="taskList-${dateStr}">
                    ${dayTasks.length === 0 ? '<li class="empty-message">Нет задач</li>' : ''}
                    ${dayTasks.map((task, idx) => `
                        <li class="task ${task.done ? 'done' : ''}">
                            <input type="checkbox" ${task.done ? 'checked' : ''} 
                                   onchange="toggleTask('${dateStr}', ${idx})">
                            <span>${task.title}</span>
                            <span class="task-time">${formatHours(task.time || 0)}</span>
                            <button class="delete-btn" onclick="deleteTask('${dateStr}', ${idx})">✖</button>
                        </li>
                    `).join('')}
                </ul>

                <form class="add-form" onsubmit="addTask(event, '${dateStr}')">
                    <input type="text" placeholder="Задача..." required>
                    <button type="submit">+</button>
                </form>
            `;
            return card;
        }

        // Быстрое добавление времени через ползунок
        function quickAddTime(slider, dateStr) {
            const hours = parseFloat(slider.value);
            if (!tasks[dateStr]) tasks[dateStr] = [];
            tasks[dateStr].push({
                title: '💪 Работа',
                done: false,
                time: hours
            });
            saveTasks();
            if (currentView === 'week') renderWeek();
            else showSelectedDates();
        }

        // Рендер недели
        function renderWeek() {
            const container = document.getElementById('viewContainer');
            const dates = getWeekDates();
            const todayStr = formatDate(new Date());

            container.innerHTML = '<div class="week-grid"></div>';
            const grid = container.querySelector('.week-grid');

            dates.forEach(date => {
                const dateStr = formatDate(date);
                grid.appendChild(renderDay(date, dateStr === todayStr));
            });

            currentView = 'week';
        }

        // Добавление задачи
        function addTask(event, dateStr) {
            event.preventDefault();
            const form = event.target;
            const title = form.querySelector('input[type="text"]').value.trim();

            if (title) {
                if (!tasks[dateStr]) tasks[dateStr] = [];
                tasks[dateStr].push({ title: title, done: false, time: 0 });
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
        }

        function toggleTask(dateStr, idx) {
            if (tasks[dateStr] && tasks[dateStr][idx]) {
                tasks[dateStr][idx].done = !tasks[dateStr][idx].done;
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
        }

        function deleteTask(dateStr, idx) {
            if (tasks[dateStr]) {
                tasks[dateStr].splice(idx, 1);
                if (tasks[dateStr].length === 0) delete tasks[dateStr];
                saveTasks();
                if (currentView === 'week') renderWeek();
                else showSelectedDates();
            }
        }

        function clearAllTasks() {
            if (confirm('Точно удалить все задачи?')) {
                tasks = {};
                saveTasks();
                renderWeek();
            }
        }

        function showSelectedDates() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            if (!start || !end) {
                alert('Выбери начальную и конечную даты!');
                return;
            }

            if (start > end) {
                alert('Начальная дата не может быть позже конечной!');
                return;
            }

            const container = document.getElementById('viewContainer');
            container.innerHTML = '<div class="week-grid"></div>';
            const grid = container.querySelector('.week-grid');

            const current = parseDate(start);
            const endDate = parseDate(end);
            const todayStr = formatDate(new Date());

            while (current <= endDate) {
                const dateStr = formatDate(current);
                grid.appendChild(renderDay(new Date(current), dateStr === todayStr));
                current.setDate(current.getDate() + 1);
            }

            currentView = 'custom';
        }

        function showWeek() {
            renderWeek();
        }

        function updateStats() {
            let total = 0, done = 0, totalTime = 0, doneTime = 0;
