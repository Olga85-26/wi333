<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 Планер дел с тайм-трекингом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .controls label {
            font-weight: bold;
            color: #555;
        }

        .controls input[type="date"] {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #5a67d8;
        }

        .clear-all {
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-all:hover {
            background: #c82333;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .day-card:hover {
            transform: translateY(-4px);
        }

        .day-card.today {
            border: 3px solid #ff6b6b;
            background: linear-gradient(to bottom, white, #fff5f5);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
            gap: 5px;
        }

        .day-name {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #4a4a4a;
        }

        .day-date {
            font-size: 0.9rem;
            color: #888;
        }

        .time-bar {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .time-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .time-bar-header strong {
            color: #333;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #28a745, #20c997);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: white;
            font-weight: bold;
            min-width: 20px;
        }

        /* ===== ДВОЙНОЕ ТАБЛО ВРЕМЕНИ ===== */
        .time-setter {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .time-inputs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .time-input-group {
            text-align: center;
        }

        .time-input-group label {
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        .time-input-group input {
            width: 70px;
            height: 50px;
            background: #0f0f23;
            border: 2px solid #00ff88;
            border-radius: 8px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
            outline: none;
            transition: border-color 0.2s;
        }

        .time-input-group input:focus {
            border-color: #00ccff;
            box-shadow: 0 0 15px rgba(0,204,255,0.3);
        }

        .time-input-group input.error {
            border-color: #ff4444;
            animation: shake 0.3s;
        }

        @keyframes shake {
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .time-colon {
            color: #00ff88;
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        /* Слайдеры */
        .time-sliders {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-row label {
            color: #aaa;
            font-size: 0.85rem;
            min-width: 60px;
            text-align: right;
        }

        .slider-row input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: 2px solid #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.5);
        }

        .slider-row input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            border: 2px solid #00ff88;
        }

        .slider-row .slider-value {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            background: #0f0f23;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        /* Кнопки добавления */
        .time-actions {
            display: flex;
            gap: 8px;
        }

        .add-time-btn {
            flex: 1;
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-time-btn:hover {
            background: #00cc55;
            transform: scale(1.02);
        }

        .add-time-btn.reset {
            background: #666;
            color: white;
        }

        .add-time-btn.reset:hover {
            background: #555;
        }

        .total-display {
            text-align: center;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
        }

        .task-list {
            list-style: none;
            min-height: 60px;
            margin-bottom: 12px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            margin-bottom: 6px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: background 0.2s;
            flex-wrap: wrap;
        }

        .task.done span {
            text-decoration: line-through;
            color: #999;
        }

        .task.done {
            background: #e8f5e9;
        }

        .task input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #28a745;
        }

        .task span {
            font-size: 0.95rem;
            flex: 1;
            min-width: 100px;
        }

        .task .task-time {
            font-size: 0.85rem;
            color: #ffffff;
            background: #1a1a2e;
            padding: 3px 10px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border: 1px solid #00ff88;
            box-shadow: 0 0 5px rgba(0,255,136,0.3);
        }

        .task .delete-btn {
            color: #dc3545;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            padding: 0 4px;
        }

        .task .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .add-form input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .add-form input[type="text"]:focus {
            border-color: #667eea;
        }

        .add-form button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-form button:hover {
            background: #5a67d8;
        }

        .empty-message {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
        }

        .stats {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-top: 20px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Планер охуенной Ви</h1>

        <div class="controls">
            <label>С:</label>
            <input type="date" id="startDate">
            <label>по:</label>
            <input type="date" id="endDate">
            <button onclick="showSelectedDates()">📅 Показать даты</button>
            <button onclick="showWeek()">📆 Показать неделю</button>
            <button class="clear-all" onclick="clearAllTasks()">🗑 Очистить все</button>
        </div>

        <div id="viewContainer"></div>
        <div class="stats" id="stats"></div>
    </div>

    <script>
        // Задачи
        let tasks = {};
        let currentView = 'week';

        // Загрузка из localStorage
        function loadTasks() {
            const saved = localStorage.getItem('plannerTasksV4');
            if (saved) tasks = JSON.parse(saved);
        }

        function saveTasks() {
            localStorage.setItem('plannerTasksV4', JSON.stringify(tasks));
        }

        function formatDate(date) {
            return date.getFullYear() + '-' +
                   String(date.getMonth() + 1).padStart(2, '0') + '-' +
                   String(date.getDate()).padStart(2, '0');
        }

        function parseDate(str) {
            const parts = str.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function getWeekDates() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

        // Форматирование часов в ЧЧ:ММ
        function formatTime(hours) {
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            if (m === 60) {
                return String(h + 1).padStart(2, '0') + ':00';
            }
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }

        // Обновление значений из слайдеров
        function updateClockInputs(dateStr) {
            const hSlider = document.getElementById('hSlider-' + dateStr);
            const mSlider = document.getElementById('mSlider-' + dateStr);
            const hInput = document.getElementById('hInput-' + dateStr);
            const mInput = document.getElementById('mInput-' + dateStr);
            
            if (hSlider && mSlider) {
                hInput.value = parseInt(hSlider.value);
                mInput.value = parseInt(mSlider.value);
                
                const hVal = document.getElementById('hSliderVal-' + dateStr);
                const mVal = document.getElementById('mSliderVal-' + dateStr);
                
                if (hVal) hVal.textContent = String(parseInt(hSlider.value)).padStart(2, '0');
                if (mVal) mVal.textContent = String(parseInt(mSlider.value)).padStart(2, '0');
            }
        }

        // Добавление времени из полей
        function addTimeFromInputs(dateStr) {
            const hInput = document.getElementById('hInput-' + dateStr);
            const mInput = document.getElementById('mInput-' + dateStr);
            
            let hours = parseInt(hInput.value) || 0;
            let minutes = parseInt(mInput.value) || 0;
            
            // Валидация
            let hasError = false;
            if (hours > 24) { hInput.classList.add('error'); hasError = true; }
            else hInput.classList.remove('error');
            
            if (minutes > 60) { mInput.classList.add('error'); hasError = true; }
            else mInput.classList.remove('error');
            
            if (hasError) {
                setTimeout(() => {
                    hInput.classList.remove('error');
                    mInput.classList.remove('error');
                }, 2000);
                return;
            }
            
            const totalHours = hours + (minutes / 60);
            
            if (totalHours > 0) {
                if (!tasks[dateStr]) tasks[dateStr] = [];
                tasks[dateStr].push({
                    title: '💪 Работа',
                    done: false,
                    time: totalHours
                });
                saveTasks();
                renderCurrentView();
            }
        }

        // Сброс полей ввода
        function resetTimeInputs(dateStr) {
            document.getElementById('hInput-' + dateStr).value = '00';
            document.getElementById('mInput-' + dateStr).value = '00';
            document.getElementById('hSlider-' + dateStr).value = 0;
            document.getElementById('mSlider-' + dateStr).value = 0;
            updateClockInputs(dateStr);
        }

        // Рендер дня
        function renderDay(date, isToday) {
            const dateStr = formatDate(date);
            const dayTasks = tasks[dateStr] || [];
            const totalTime = dayTasks.reduce((sum, t) => sum + (t.time || 0), 0);
            const doneTime = dayTasks.filter(t => t.done).reduce((sum, t) => sum + (t.time || 0), 0);

            const card = document.createElement('div');
            card.className = 'day-card' + (isToday ? ' today' : '');
            card.innerHTML = `
                <div class="day-header">
                    <span class="day-name">${dayNames[date.getDay() === 0 ? 6 : date.getDay() - 1]}</span>
                    <span class="day-date">${date.getDate()}.${date.getMonth() + 1}.${date.getFullYear()}${isToday ? ' 📌' : ''}</span>
                </div>

                <div class="time-bar">
                    <div class="time-bar-header">
                        <strong>⏱ Всего: ${formatTime(totalTime)}</strong>
                        <span>✅ Выполнено: ${formatTime(doneTime)}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${totalTime > 0 ? (doneTime / totalTime * 100) : 0}%;">
                            ${totalTime > 0 ? Math.round(doneTime / totalTime * 100) + '%' : ''}
                        </div>
                    </div>
                </div>

                <!-- ДВОЙНОЕ ТАБЛО ВРЕМЕНИ -->
                <div class="time-setter">
                    <div class="total-display">
                        Итого: ${formatTime(totalTime)}
                    </div>
                    <div class="time-inputs">
                        <div class="time-input-group">
                            <label>Часы</label>
                            <input type="number" id="hInput-${dateStr}" value="00" min="0" max="24" step="1" oninput="updateSlidersFromInput('${dateStr}')">
                        </div>
                        <span class="time-colon">:</span>
                        <div class="time-input-group">
                            <label>Минуты</label>
                            <input type="number" id="mInput-${dateStr}" value="00" min="0" max="59" step="5" oninput="updateSlidersFromInput('${dateStr}')">
                        </div>
                    </div>

                    <div class="time-sliders">
                        <div class="slider-row">
                            <label>Часы</label>
                            <input type="range" id="hSlider-${dateStr}" min="0" max="24" value="0" step="1" 
                                   oninput="updateClockInputs('${dateStr}')">
                            <span class="slider-value" id="hSliderVal-${dateStr}">00</span>
                        </div>
                        <div class="slider-row">
                            <label>Минуты</label>
                            <input type="range" id="mSlider-${dateStr}" min="0" max="55" value="0" step="5" 
                                   oninput="updateClockInputs('${dateStr}')">
                            <span class="slider-value" id="mSliderVal-${dateStr}">00</span>
                        </div>
                    </div>

                    <div class="time-actions">
                        <button class="add-time-btn" onclick="addTimeFromInputs('${dateStr}')">⏱ + Добавить</button>
                        <button class="add-time-btn reset" onclick="resetTimeInputs('${dateStr}')">↺ Сброс</button>
                    </div>
                </div>

                <ul class="task-list" id="taskList-${dateStr}">
                    ${dayTasks.length === 0 ? '<li class="empty-message">Нет задач</li>' : ''}
                    ${dayTasks.map((task, idx) => `
                        <li class="task ${task.done ? 'done' : ''}">
                            <input type="checkbox" ${task.done ? 'checked' : ''} 
                                   onchange="toggleTask('${dateStr}', ${idx})">
                            <span>${task.title}</span>
                            <span class="task-time">${formatTime(task.time || 0)}</span>
                            <button class="delete-btn" onclick="deleteTask('${dateStr}', ${idx})">✖</button>
                        </li>
                    `).join('')}
                </ul>

                <form class="add-form" onsubmit="addTask(event, '${dateStr}')">
                    <input type="text" placeholder="Задача..." required>
                    <button type="submit">+</button>
                </form>
            `;
            return card;
        }

        // Синхронизация полей ввода со слайдерами
        function updateSlidersFromInput(dateStr) {
            const hInput = document.getElementById('hInput-' + dateStr);
            const mInput = document.getElementById('mInput-' + dateStr);
            const hSlider = document.getElementById('hSlider-' + dateStr);
            const mSlider = document.getElementById('mSlider-' + dateStr);
            
            let h = parseInt(hInput.value) || 0;
            let m = parseInt(mInput.value) || 0;
            
            if (h > 24) h = 24;
            if (h < 0) h = 0;
            if (m > 55) m = 55;
            if (m < 0) m = 0;
            
            hSlider.value = h;
            mSlider.value = m;
            
            document.getElementById('hSliderVal-' + dateStr).textContent = String(h).padStart(2, '0');
            document.getElementById('mSliderVal-' + dateStr).textContent = String(m).padStart(2, '0');
        }

        // Рендер недели
        function renderWeek() {
            const container = document.getElementById('viewContainer');
            const dates = getWeekDates();
            const todayStr = formatDate(new Date());

            container.innerHTML = '<div class="week-grid"></div>';
            const grid = container.querySelector('.week-grid');

            dates.forEach(date => {
                const dateStr = formatDate(date);
                grid.appendChild(renderDay(date, dateStr === todayStr));
            });

            currentView = 'week';
        }

        // Рендер текущего вида
        function renderCurrentView() {
            if (currentView === 'week') renderWeek();
            else showSelectedDates();
        }

        // Добавление задачи
        function addTask(event, dateStr) {
            event.preventDefault();
            const form = event.target;
            const title = form.querySelector('input[type="text"]').value.trim();

            if (title) {
                if (!tasks[dateStr]) tasks[dateStr] = [];
                tasks[dateStr].push({ title: title, done: false, time: 0 });
                saveTasks();
                renderCurrentView();
            }
        }

        function toggleTask(dateStr, idx) {
            if (tasks[dateStr] && tasks[dateStr][idx]) {
                tasks[dateStr][idx].done = !tasks[dateStr][idx].done;
                saveTasks();
                renderCurrentView();
            }
        }

        function deleteTask(dateStr, idx) {
            if (tasks[dateStr]) {
                tasks[dateStr].splice(idx, 1);
                if (tasks[dateStr].length === 0) delete tasks[dateStr];
                saveTasks();
                renderCurrentView();
            }
        }

        function clearAllTasks() {
            if (confirm('Точно удалить все задачи?')) {
                tasks = {};
                saveTasks();
                renderWeek();
            }
        }

        function showSelectedDates() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            if (!start || !end) {
                alert('Выбери начальную и конечную даты!');
                return;
            }

            if (start > end) {
                alert('Начальная дата не может быть позже конечной!');
                return;
            }

            const container = document.getElementById('viewContainer');
            container.innerHTML = '<div class="week-grid"></div>';
            const grid = container.querySelector('.week-grid');

            const current = parseDate(start);
            const endDate = parseDate(end);
            const todayStr = formatDate(new Date());

            while (current <= endDate) {
                const dateStr = formatDate(current);
                grid.appendChild(renderDay(new Date(current), dateStr === todayStr));
                current.setDate(current.getDate() + 1);
            }

            currentView = 'custom';
        }

        function showWeek() {
            renderWeek();
        }

        function updateStats() {
            let total = 0, done = 0, totalTime = 0, doneTime = 0;
            
            Object.keys(tasks).forEach(date => {
                tasks[date].forEach(task => {
                    total++;
                    if (task.done) done++;
                    totalTime += task.time || 0;
                    if (task.done) doneTime += task.time || 0;
                });
            });

            const percent = total > 0 ? Math.round((done / total) * 100) : 0;
            const timePercent = totalTime > 0 ? Math.round((doneTime / totalTime) * 100) : 0;

        }

        function setDefaultDates() {
            const today = new Date();
            const weekAgo = new Date(today);
            weekAgo.setDate(today.getDate() - 7);
            
            document.getElementById('startDate').value = formatDate(weekAgo);
            document.getElementById('endDate').value = formatDate(today);
        }

        // Инициализация
        loadTasks();
        setDefaultDates();
        renderWeek();
        updateStats();
    </script>
</body>
</html>
